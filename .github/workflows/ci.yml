name: ci

# R0：自动门。只跑本地确定性检查（类型、依赖方向、测试、密钥、报告与基线对照）。
# B3 只回放仓库内 cassette；不调用真实 LLM，不访问模型 API。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (cassette replay, no LLM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check import direction
        run: pnpm check:imports

      - name: Run all tests
        run: pnpm test:all

      - name: Scan for secrets
        run: pnpm check:secrets

      - name: Regenerate world reports (cassette replay, no network)
        run: node demos/world/src/cli.ts report

      - name: Compare against expected baseline
        run: pnpm check:baseline

      - name: Assert expected baseline was not rewritten
        run: git diff --exit-code -- reports/baseline.expected.json
